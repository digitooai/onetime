# Production overrides for onetime.digitoo.ai.
#
# Used by .github/workflows/deploy.yml. Excluded from the packaged chart via
# .helmignore — it is deployment configuration for one specific environment,
# not part of the reusable chart.
#
# NOTHING SECRET GOES IN THIS FILE. The master keyring and the Dragonfly
# password live in Azure Key Vault `prod-digitoo-shared-kv` and are synced into
# the namespace by the ExternalSecrets in extraObjects at the bottom.
#
# Target cluster: Azure AKS `digitoo-prod` (resource group digitoo-dev), the
# same cluster the other Digitoo services deploy to.


# Image lives in Digitoo's ACR, like every other service. The tag is set on the
# command line by the deploy workflow to the release version.
image:
  registry: digitooai.azurecr.io
  repository: onetime

# ACR pull secret, reconciled into the namespace by the deploy workflow.
imagePullSecrets:
  - name: acr-pull

# Scraped by annotation, like the rest of this cluster: digitoo-prod has no
# Prometheus Operator CRDs, so ServiceMonitor/PrometheusRule are off below.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: /metrics

config:
  baseURL: https://onetime.digitoo.ai
  logLevel: info
  logFormat: json
  defaultLang: cs
  strictStartup: true

  # AKS runs Azure CNI (not overlay): pods, including the F5 ingress controller,
  # take their IPs from the node subnet 10.240.0.0/16. The ingress Service has
  # externalTrafficPolicy: Local, so the client address reaches the controller
  # intact and arrives here in X-Forwarded-For.
  #
  # Why it matters: without the right range every request is attributed to the
  # ingress controller's own pod IP, so the daily upload quota and the passphrase
  # throttle collapse into one bucket shared by everyone.
  trustedProxies:
    - 10.240.0.0/16

  limits:
    maxFileBytes: 52428800
    # 3 GiB: under the 85 % upload watermark of the 4Gi volume (~3.4 GiB).
    totalStorageBytes: 3221225472
    # 200 MiB/day per client address; at the 500 MiB default one office NAT
    # address could fill the volume within a week.
    dailyBytesPerIP: 209715200

  # Raised for creation: the limiter counts per client address, and everyone
  # behind one office NAT gateway shares a single address. See docs/RUNBOOK.md.
  rateLimits:
    createText: "300/50"
    createFile: "100/20"
    generate: "300/50"

masterKey:
  # Written by the ExternalSecret in extraObjects. Set again on the command line by the
  # workflow, so a manual `helm upgrade -f values-production.yaml` cannot fall
  # back to a chart-generated key.
  existingSecret: onetime-master-key
  existingSecretKey: master.keys
  autoGenerate: false
  hardenPermissions: true

# Shared Dragonfly `dragonfly-api-prod` in infra-apps, DB 0. The API and the
# frontends select DBs 4-15 in code; DB 0 is onetime's alone. Every key carries
# the `ots:` prefix. Never FLUSHDB/FLUSHALL here — see docs/RUNBOOK.md.
#
# Dragonfly runs without cache_mode, i.e. it never evicts, which is what the
# app's noeviction startup check wants.
redis:
  mode: external
  external:
    # No credentials here: the password is mounted from `onetime-redis`. The DB
    # index is taken from the URL path.
    url: redis://dragonfly-api-prod.infra-apps.svc.cluster.local:6379/0
    db: 0
    existingPasswordSecret: onetime-redis
    passwordKey: password

persistence:
  enabled: true
  # Blobs only (file uploads and texts over 100 KiB); passwords live in
  # Dragonfly. 4Gi is the smallest Azure disk billing tier (E1); the class
  # allows online expansion if uploads ever need more.
  size: 4Gi
  # Empty string = the AKS default StorageClass (StandardSSD_LRS block storage).
  storageClass: ""
  accessMode: ReadWriteOnce

# Static (non-autoscaled, non-spot) pool. With strategy Recreate and a zonal
# RWO disk, every reschedule is an outage; keep the pod off pools that scale
# down under it.
nodeSelector:
  digitoo.ai/node-type: static

ingress:
  enabled: true

  # This cluster runs the NGINX Inc. controller (nginx.org/ingress-controller),
  # NOT the community ingress-nginx. Its IngressClass is "f5".
  className: f5
  host: onetime.digitoo.ai

  tls:
    enabled: true
    # Cloudflare DNS-01 issuer on this cluster.
    clusterIssuer: letsencrypt-prod

  # The chart's built-in annotations are for the community controller and use
  # the nginx.ingress.kubernetes.io/ prefix. This controller ignores that prefix
  # entirely — silently, so a 50 MB upload would simply fail at NGINX's 1 MB
  # default with no hint as to why. Replacing the whole block is the point of
  # overrideAnnotations.
  #
  # Shape copied from tori/tori-api, which already solves the same problem here.
  overrideAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Must exceed ONETIME_MAX_FILE_BYTES plus multipart framing.
    nginx.org/client-max-body-size: 52m

    # A security control, not a performance tweak. With request buffering on
    # (the NGINX default) the controller spools the whole body to disk on the
    # ingress pod before forwarding it — up to 50 MB of user plaintext on a
    # host this app does not control, does not encrypt and never cleans up.
    nginx.org/location-snippets: |
      proxy_request_buffering off;

    # A 50 MB transfer to a phone is legitimately slow; the 60s default would
    # cut it off mid-file.
    nginx.org/proxy-read-timeout: 300s
    nginx.org/proxy-send-timeout: 300s
    nginx.org/redirect-to-https: "True"

  # Response security headers are deliberately NOT set here. The app emits them
  # itself (internal/httpx/security.go), which keeps them correct per route and
  # avoids depending on the headers-more module being compiled into this
  # controller image.

# Off: digitoo-prod runs with networkPolicy "none", so a NetworkPolicy would not
# be enforced anyway. The selectors and egress below match this cluster, so it
# can be switched on as-is once a policy engine is enabled.
networkPolicy:
  enabled: false
  ingressControllerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: nginx-ingress
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-apps
      ports:
        - port: 6379
          protocol: TCP

# No Prometheus Operator CRDs on digitoo-prod; enabling either fails the
# install. Metrics are scraped via podAnnotations above.
serviceMonitor:
  enabled: false
prometheusRule:
  enabled: false

resources:
  app:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 768Mi

# Off deliberately: at one replica a PDB is either a permanent drain block or a
# no-op. See deploy/helm/onetime/README.md.
podDisruptionBudget:
  enabled: false

# ExternalSecrets (ClusterSecretStore `prod-secret-store` -> Key Vault
# `prod-digitoo-shared-kv`). Maps in extraObjects are rendered verbatim, so the
# External Secrets template below reaches the cluster without Helm evaluating it.
# deletionPolicy Retain keeps the Secret if the vault entry is deleted or
# renamed by mistake; the vault is the keyring's only backup.
extraObjects:
  # Master keyring ("v1:<base64>", newest first) -> masterKey.existingSecret.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: onetime-master-key
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: prod-secret-store
      target:
        name: onetime-master-key
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: master.keys
          remoteRef:
            key: onetime-prod-master-keys

  # Dragonfly password -> redis.external.existingPasswordSecret. The vault entry
  # is the redis://:<password>@dragonfly-api-prod.infra-apps:6379/ URL the API
  # and frontends use; only the password is kept, so a rotation there reaches
  # this deployment without a second copy. It stays percent-encoded as in the
  # URL (sprig has no URL decoder), so the password must be URL-safe.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: onetime-redis
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: prod-secret-store
      target:
        name: onetime-redis
        creationPolicy: Owner
        deletionPolicy: Retain
        template:
          engineVersion: v2
          data:
            password: '{{ regexReplaceAll "^[^:]*:" (.url | urlParse).userinfo "" }}'
      data:
        - secretKey: url
          remoteRef:
            key: api-prod-redis-url

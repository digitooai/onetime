# Production overrides for onetime.digitoo.ai.
#
# Used by .github/workflows/deploy.yml. Excluded from the packaged chart via
# .helmignore — it is deployment configuration for one specific environment,
# not part of the reusable chart.
#
# NOTHING SECRET GOES IN THIS FILE. The master keyring lives in the
# externally managed Secret `onetime-master-key`, which the deploy workflow
# refuses to proceed without.
#
# Target cluster: Azure AKS `digitoo-prod` (resource group digitoo-dev), the
# same cluster the other Digitoo services deploy to. Deployed by
# .github/workflows/deploy.yml.

# Image lives in Digitoo's ACR, like every other service. The tag is set on the
# command line by the deploy workflow to the release version.
image:
  registry: digitooai.azurecr.io
  repository: onetime

# ACR pull secret, reconciled into the namespace by the deploy workflow.
imagePullSecrets:
  - name: acr-pull

config:
  baseURL: https://onetime.digitoo.ai
  logLevel: info
  logFormat: json
  defaultLang: cs
  strictStartup: true

  # DIGITOO-TODO: set to the AKS pod CIDR. 10.42.0.0/16 was the RKE2 canal range
  # and is wrong here. Azure CNI overlay commonly uses 10.244.0.0/16 — confirm
  # with the cluster's network profile, or:
  #   kubectl get nodes -o jsonpath='{range .items[*]}{.spec.podCIDR}{"\n"}{end}'
  #
  # Why it matters: without the right range every request is attributed to the
  # ingress controller's own pod IP, so the daily upload quota and the passphrase
  # throttle collapse into one bucket shared by everyone — the first person to
  # upload a few files locks out the whole company. A wrong value does not block
  # the deploy; it only breaks per-client limiting until corrected.
  trustedProxies:
    - 10.244.0.0/16

  limits:
    maxFileBytes: 52428800
    totalStorageBytes: 21474836480   # 20 GiB, matches persistence.size

  # Left at the built-in defaults for now. Raise these if Digitoo staff start
  # hitting them: the limiter counts per client address, and everyone behind
  # one office NAT gateway shares a single address. See docs/RUNBOOK.md.
  rateLimits: {}

masterKey:
  # Set again on the command line by the workflow; repeated here so that a
  # manual `helm upgrade -f values-production.yaml` cannot accidentally fall
  # back to a chart-generated key.
  existingSecret: onetime-master-key
  existingSecretKey: master.keys
  autoGenerate: false
  hardenPermissions: true

redis:
  mode: sidecar
  maxmemory: 192mb

persistence:
  enabled: true
  size: 20Gi
  # Empty string = use the AKS cluster default StorageClass (managed-csi), which
  # is block storage and supports ReadWriteOnce natively. The RKE2 Ceph class
  # (csi-rbd-sc) does not exist on AKS and would leave the PVC Pending.
  storageClass: ""
  accessMode: ReadWriteOnce

ingress:
  enabled: true

  # This cluster runs the NGINX Inc. controller (nginx.org/ingress-controller),
  # NOT the community ingress-nginx. Two classes exist: "f5" is public-facing,
  # "f5-internal" is not reachable from outside.
  className: f5
  host: onetime.digitoo.ai

  tls:
    enabled: true
    # admin-console deploys to this same AKS cluster with letsencrypt-prod
    # (HTTP-01), so that issuer is known to exist here. Switch to a DNS-01 issuer
    # if the digitoo.ai zone is managed by this cert-manager instance.
    clusterIssuer: letsencrypt-prod

  # The chart's built-in annotations are for the community controller and use
  # the nginx.ingress.kubernetes.io/ prefix. This controller ignores that prefix
  # entirely — silently, so a 50 MB upload would simply fail at NGINX's 1 MB
  # default with no hint as to why. Replacing the whole block is the point of
  # overrideAnnotations.
  #
  # Shape copied from tori/tori-api, which already solves the same problem here.
  overrideAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Must exceed ONETIME_MAX_FILE_BYTES plus multipart framing.
    nginx.org/client-max-body-size: 52m

    # A security control, not a performance tweak. With request buffering on
    # (the NGINX default) the controller spools the whole body to disk on the
    # ingress pod before forwarding it — up to 50 MB of user plaintext on a
    # host this app does not control, does not encrypt and never cleans up.
    nginx.org/location-snippets: |
      proxy_request_buffering off;

    # A 50 MB transfer to a phone is legitimately slow; the 60s default would
    # cut it off mid-file.
    nginx.org/proxy-read-timeout: 300s
    nginx.org/proxy-send-timeout: 300s
    nginx.org/redirect-to-https: "True"

  # Response security headers are deliberately NOT set here. The app emits them
  # itself (internal/httpx/security.go), which keeps them correct per route and
  # avoids depending on the headers-more module being compiled into this
  # controller image.

# Disabled for the AKS cutover: the selectors below were for the RKE2 cluster
# (ingress controller in `nginx-ingress`, monitoring in `mon`) and would
# silently block all inbound traffic on AKS, where those namespaces differ.
# admin-console runs on this cluster without a NetworkPolicy. DIGITOO-TODO:
# re-enable once the AKS ingress-controller and monitoring namespaces are
# confirmed, then point the two selectors at them.
networkPolicy:
  enabled: false
  ingressControllerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: nginx-ingress
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: mon

serviceMonitor:
  enabled: true
prometheusRule:
  enabled: true
  additionalRuleLabels: {}

resources:
  app:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 768Mi

# Off deliberately: at one replica a PDB is either a permanent drain block or a
# no-op. See deploy/helm/onetime/README.md.
podDisruptionBudget:
  enabled: false

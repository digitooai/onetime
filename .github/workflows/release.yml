name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: digitooai/onetime
  CHART_REGISTRY: oci://ghcr.io/digitooai/charts
  HELM_VERSION: v3.18.4

jobs:
  # ---------------------------------------------------------------------------
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this OIDC token for a short-lived
      # Fulcio certificate. No long-lived signing key exists to leak or rotate.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NOTE: no QEMU step, and that is deliberate.
      #
      # The Dockerfile builder runs on $BUILDPLATFORM and cross-compiles via
      # GOOS/GOARCH, so linux/arm64 is produced by a native amd64 toolchain.
      # Adding setup-qemu-action would instead emulate the whole arm64 compile,
      # which for a Go build of this size is roughly a 5-10x slowdown for no
      # benefit whatsoever.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-
            # `latest` only for final releases. Without the guard, tagging
            # v1.5.0-rc.1 would move `latest` onto a release candidate and
            # every `docker pull onetime` in the wild would silently follow it.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # mode=max records the full build graph, including every base image
          # and build argument, so a consumer can reconstruct exactly what went
          # into the artefact.
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the DIGEST, never a tag. A tag is a mutable pointer: signing
      # `:v1.2.3` would leave the signature valid after someone repushes that
      # tag with different content.
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM file
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: onetime-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: onetime-sbom.spdx.json
          retention-days: 30

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "## Image"
            echo
            echo '```'
            echo "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            echo '```'
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\` (cross-compiled, no emulation)"
            echo
            echo "### Verify before you deploy"
            echo
            echo "Pin the digest, not the tag — a tag can be repushed, a digest cannot:"
            echo
            echo '```bash'
            echo "cosign verify ${REGISTRY}/${IMAGE_NAME}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\\.github/workflows/release\\.yml@refs/tags/v.*\$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo
            echo "# build provenance (who built it, from which commit, with which workflow)"
            echo "gh attestation verify oci://${REGISTRY}/${IMAGE_NAME}@${DIGEST} --repo ${{ github.repository }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  chart:
    name: Publish Helm chart
    runs-on: ubuntu-24.04
    needs: [image]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Derive version
        id: v
        run: |
          # Chart versions are SemVer without the leading v.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart version: ${VERSION}"

      - name: Lint before publishing
        run: |
          helm lint deploy/helm/onetime --strict \
            --values deploy/helm/onetime/ci/default-values.yaml

      - name: Package
        id: pkg
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          # appVersion is pinned to the image tag published by the `image` job,
          # so `helm install` without an explicit image.tag lands on exactly
          # the artefact this workflow just signed.
          helm package deploy/helm/onetime \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist
          echo "path=dist/onetime-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      # Two logins, because they read different credential stores. helm writes
      # to its own config; cosign reads Docker's. Without the second one the
      # chart pushes fine and then fails to sign, which is a confusing way to
      # discover that the signature was never the same operation as the push.
      - name: Log in to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Log in to GHCR (cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart
        id: push
        env:
          CHART: ${{ steps.pkg.outputs.path }}
        run: |
          helm push "${CHART}" "${CHART_REGISTRY}" 2>&1 | tee push.log
          DIGEST=$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -n1)
          if [ -z "${DIGEST}" ]; then
            echo "::error::could not determine chart digest from helm push output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/digitooai/charts/onetime@${DIGEST}"

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: ${{ steps.pkg.outputs.path }}
          retention-days: 30

      - name: Summary
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Helm chart"
            echo
            echo '```bash'
            echo "helm install onetime oci://ghcr.io/digitooai/charts/onetime --version ${VERSION} \\"
            echo "  --set config.baseURL=https://onetime.digitoo.ai \\"
            echo "  --set masterKey.existingSecret=onetime-master-key"
            echo '```'
            echo
            echo "Chart digest: \`${DIGEST}\`"
            echo
            echo '```bash'
            echo "cosign verify ghcr.io/digitooai/charts/onetime@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\\.github/workflows/release\\.yml@refs/tags/v.*\$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Build changelog
        id: changelog
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "${PREV}" ]; then
              git log --no-merges --pretty='- %s (%h)' "${PREV}..${GITHUB_REF_NAME}"
              echo
              echo "**Full diff**: https://github.com/${{ github.repository }}/compare/${PREV}...${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s (%h)'
            fi
            echo
            echo "## Artefacts"
            echo
            echo '| Artefact | Reference |'
            echo '| --- | --- |'
            echo "| Image | \`ghcr.io/digitooai/onetime@${DIGEST}\` |"
            echo "| Chart | \`oci://ghcr.io/digitooai/charts/onetime\` version \`${GITHUB_REF_NAME#v}\` |"
            echo
            echo "Both are signed with cosign (keyless) and carry SLSA build provenance."
            echo
            echo '```bash'
            echo "cosign verify ghcr.io/digitooai/onetime@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\\.github/workflows/release\\.yml@refs/tags/v.*\$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "## Upgrade notes"
            echo
            echo "- The chart deploys with \`strategy: Recreate\` whenever persistence is enabled, so an upgrade is a brief full outage. That is intentional: RollingUpdate over a ReadWriteOnce volume deadlocks."
            echo "- Never drop a master key id that still has live secrets. Rotate by prepending."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: RELEASE_NOTES.md
          # A tag containing a hyphen is a pre-release (v1.5.0-rc.1), matching
          # the `latest` guard on the image tags.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.tgz
            artifacts/*.spdx.json
          fail_on_unmatched_files: true
